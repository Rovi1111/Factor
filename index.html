<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Расходы на серверы</title>
<style>
:root{
  --bg:#f6f7f9; --card:#ffffff; --text:#1c2230; --muted:#6b7385; --line:#e3e6ec; --line2:#eef0f4;
  --accent:#2f6fde; --accent-soft:#e8f0fd;
  --up:#c2410c; --up-soft:#fdeee6; --down:#15803d; --down-soft:#e5f5ea;
  --new:#7c3aed; --new-soft:#f1eafe; --gone:#6b7385; --gone-soft:#eef0f4;
  --warn:#92400e; --warn-soft:#fef3c7;
  --f-vol:#2f6fde; --f-rate:#d97706; --f-rub:#0d9488;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12151b; --card:#1a1e26; --text:#e6e9ef; --muted:#9aa3b5; --line:#2c323d; --line2:#232832;
    --accent:#6ea1ff; --accent-soft:#1d2a44;
    --up:#fb923c; --up-soft:#3a2418; --down:#4ade80; --down-soft:#15301f;
    --new:#b794f6; --new-soft:#2a2142; --gone:#9aa3b5; --gone-soft:#262b35;
    --warn:#fcd34d; --warn-soft:#3a3013;
    --f-vol:#6ea1ff; --f-rate:#fbbf24; --f-rub:#2dd4bf;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:1280px;margin:0 auto;padding:24px 16px 60px}
h1{font-size:22px;margin:0 0 4px}
h2{font-size:16px;margin:0 0 12px}
.sub{color:var(--muted);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:820px){.grid2{grid-template-columns:1fr}}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:10px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
input[type=text],select,textarea{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
input[type=text]:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
input.lbl{width:120px}
input.rate{width:190px;font-family:var(--mono)}
input.rate:disabled{opacity:.5}
textarea{width:100%;min-height:240px;font-family:var(--mono);font-size:12.5px;resize:vertical;white-space:pre;tab-size:4}
.parseinfo{font-size:12px;color:var(--muted);margin-top:6px}
.parseinfo .bad{color:var(--up)}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:6px;padding:6px 12px}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}
@media (max-width:820px){.kpis{grid-template-columns:1fr 1fr}}
.kpi .k{font-size:12px;color:var(--muted)}
.kpi .v{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .s{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.pos{color:var(--up)} .neg{color:var(--down)}
.factors{display:flex;flex-direction:column;gap:10px}
.fac{display:grid;grid-template-columns:230px 1fr 130px;gap:10px;align-items:center}
@media (max-width:620px){.fac{grid-template-columns:1fr 110px}.fac .bar{grid-column:1/-1;grid-row:2}}
.fac .n{font-size:13px}
.fac .n small{display:block;color:var(--muted);font-size:11.5px}
.bar{position:relative;height:14px;background:var(--line2);border-radius:3px}
.bar .axis{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--muted);left:50%}
.bar .fill{position:absolute;top:0;bottom:0;border-radius:2px}
.fac .val{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.fac.total{border-top:1px solid var(--line);padding-top:10px}
.warns{margin:12px 0 0;display:flex;flex-direction:column;gap:6px}
.warn{background:var(--warn-soft);color:var(--warn);border-radius:6px;padding:8px 10px;font-size:13px}
.excl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--accent-soft);color:var(--accent);border-radius:12px;padding:2px 4px 2px 10px}
.chip button{border:none;background:transparent;color:inherit;padding:0 6px;font-size:14px;line-height:1}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:6px 10px;border-bottom:1px solid var(--line2);white-space:nowrap}
th{position:sticky;top:0;background:var(--card);font-size:12px;color:var(--muted);font-weight:600;text-align:right;cursor:pointer;user-select:none;border-bottom:1px solid var(--line)}
th.l,td.l{text-align:left}
td{text-align:right}
td.name{max-width:380px;overflow:hidden;text-overflow:ellipsis}
tr.tot td{font-weight:700;border-top:2px solid var(--line);background:var(--line2)}
tr.sub td{color:var(--muted);background:var(--card)}
.badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;font-weight:600}
.b-new{background:var(--new-soft);color:var(--new)}
.b-gone{background:var(--gone-soft);color:var(--gone)}
.b-chg{background:var(--accent-soft);color:var(--accent)}
.b-same{background:transparent;color:var(--muted);font-weight:400}
.rubtag{font-size:10.5px;color:var(--f-rub);margin-left:3px}
.muted{color:var(--muted)}
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.filters button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.filters input{min-width:200px}
#comment{min-height:150px;white-space:pre-wrap;font-family:inherit;font-size:13.5px}
.section{margin-top:20px}
.hint{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Расходы на серверы: сравнение месяцев</h1>
  <p class="sub">Вставьте из Excel строки «название — сумма». Одинаковые названия внутри месяца суммируются, затем месяцы сравниваются по названию.</p>

  <div class="grid2">
    <div class="card" id="cardA"></div>
    <div class="card" id="cardB"></div>
  </div>

  <div class="toolbar">
    <button id="btnSwap">Поменять A ↔ B</button>
    <button id="btnClear">Очистить</button>
    <span style="flex:1"></span>
    <button class="primary" id="btnXlsx">Выгрузить в Excel</button>
  </div>

  <div class="card">
    <div class="excl" id="exclList"></div>
    <div class="hint" style="margin-top:6px">Галочка «₽» в таблице ниже — позиция уже в рублях и не конвертируется. Список запоминается в этом браузере.</div>
  </div>

  <div id="results"></div>
</div>

<script>
(function(){
'use strict';

/* ---------- storage ---------- */
const LS_EXCL = 'srvcmp.exclusions.v1', LS_STATE = 'srvcmp.state.v1';
function lsGet(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } }
function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

/* exclusions: key -> display name */
let exclusions = new Map(Object.entries(lsGet(LS_EXCL, {})));
function saveExcl(){ lsSet(LS_EXCL, Object.fromEntries(exclusions)); }

/* ---------- parsing ---------- */
function normKey(name){ return name.replace(/[\s ]+/g, ' ').trim().toLowerCase(); }
function normName(name){ return name.replace(/[\s ]+/g, ' ').trim(); }

function parseNum(s){
  if (s == null) return NaN;
  let t = String(s).replace(/[\s  ]/g, '').replace(/[€$₽]|руб\.?|eur|usd|rub/gi, '');
  if (!t) return NaN;
  const hasC = t.includes(','), hasD = t.includes('.');
  if (hasC && hasD){
    // последний разделитель — десятичный
    if (t.lastIndexOf(',') > t.lastIndexOf('.')) t = t.replace(/\./g, '').replace(',', '.');
    else t = t.replace(/,/g, '');
  } else if (hasC){
    if ((t.match(/,/g) || []).length > 1) return NaN;
    t = t.replace(',', '.');
  }
  if (!/^[-+]?\d*\.?\d+$/.test(t)) return NaN;
  return parseFloat(t);
}

function parseTable(text){
  const rows = [], bad = [];
  text.split(/\n/).forEach((raw, i) => {
    const line = raw.replace(/\r/g, '');
    if (!line.trim()) return;
    let name, numStr;
    if (line.includes('\t')){
      const parts = line.split('\t').map(p => p.trim());
      while (parts.length && parts[parts.length - 1] === '') parts.pop();
      numStr = parts.pop();
      name = parts.filter(p => p !== '').join(' ');
    } else {
      const m = line.trim().match(/^(.*\S)\s+(\S+)$/);
      if (m){ name = m[1]; numStr = m[2]; }
    }
    const v = parseNum(numStr);
    if (!name || !isFinite(v)) { bad.push({ line: i + 1, text: line.trim() }); return; }
    rows.push({ name: normName(name), amount: v });
  });
  return { rows, bad };
}

function aggregate(rows){
  const m = new Map();
  for (const r of rows){
    const k = normKey(r.name);
    if (!m.has(k)) m.set(k, { name: r.name, amount: 0, count: 0 });
    const e = m.get(k); e.amount += r.amount; e.count++;
  }
  return m;
}

/* ---------- formatting ---------- */
const nf2 = new Intl.NumberFormat('ru-RU', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const nf1 = new Intl.NumberFormat('ru-RU', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const nf4 = new Intl.NumberFormat('ru-RU', { minimumFractionDigits: 4, maximumFractionDigits: 4 });
const fix0 = v => Math.abs(v) < 0.005 ? 0 : v;
const f2 = v => v == null ? '—' : nf2.format(fix0(v));
const s2 = v => { if (v == null) return '—'; v = fix0(v); return (v > 0 ? '+' : v < 0 ? '−' : '') + nf2.format(Math.abs(v)); };
const sPct = v => v == null || !isFinite(v) ? '—' : (v > 0.0005 ? '+' : v < -0.0005 ? '−' : '') + nf1.format(Math.abs(v * 100)) + ' %';
const sign = v => Math.abs(v) < 0.005 ? '' : v > 0 ? 'pos' : 'neg';
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const CUR_SYM = { EUR: '€', USD: '$', RUB: '₽' };

/* ---------- input cards ---------- */
const sides = ['A', 'B'];
const saved = lsGet(LS_STATE, null);
const state = saved || {
  A: { label: 'Месяц A', cur: 'EUR', rate: '', text: '' },
  B: { label: 'Месяц B', cur: 'EUR', rate: '', text: '' }
};
const el = {};

function buildCard(side){
  const c = document.getElementById('card' + side);
  c.innerHTML = `
    <div class="row">
      <label class="f">Месяц ${side}<input type="text" class="lbl" data-f="label"></label>
      <label class="f">Валюта<select data-f="cur"><option>EUR</option><option>USD</option><option>RUB</option></select></label>
      <label class="f">Курс к рублю<input type="text" class="rate" inputmode="decimal" placeholder="напр. 88,9145435850566" data-f="rate"></label>
    </div>
    <textarea spellcheck="false" data-f="text" placeholder="название&#9;сумма"></textarea>
    <div class="parseinfo"></div>`;
  el[side] = {
    label: c.querySelector('[data-f=label]'), cur: c.querySelector('[data-f=cur]'),
    rate: c.querySelector('[data-f=rate]'), text: c.querySelector('[data-f=text]'),
    info: c.querySelector('.parseinfo')
  };
  for (const f of ['label', 'cur', 'rate', 'text']){
    el[side][f].addEventListener('input', () => { state[side][f] = el[side][f].value; schedule(); });
  }
}
function fillCards(){
  for (const s of sides){
    for (const f of ['label', 'cur', 'rate', 'text']) el[s][f].value = state[s][f];
  }
}
sides.forEach(buildCard); fillCards();

let timer = null;
function schedule(){ clearTimeout(timer); timer = setTimeout(() => { lsSet(LS_STATE, state); render(); }, 150); }

/* ---------- calculation ---------- */
function levenshtein(a, b){
  if (Math.abs(a.length - b.length) > 2) return 99;
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
  return d[a.length][b.length];
}

function compute(){
  const P = {}, warns = [];
  for (const s of sides){
    const st = state[s];
    const p = parseTable(st.text);
    const rate = st.cur === 'RUB' ? 1 : parseNum(st.rate);
    P[s] = { ...p, agg: aggregate(p.rows), rate, cur: st.cur, label: st.label.trim() || ('Месяц ' + s) };
    if (st.cur !== 'RUB' && !(rate > 0) && p.rows.length) warns.push(`Не указан курс ${st.cur} для «${P[s].label}».`);
  }
  const A = P.A, B = P.B;
  const sameCur = A.cur === B.cur;
  if (!sameCur) warns.push(`Валюты месяцев различаются (${A.cur} и ${B.cur}): разница в валюте и разложение «объём / курс» не имеют смысла — всё изменение конвертируемых позиций отнесено к объёму.`);

  const keys = new Set([...A.agg.keys(), ...B.agg.keys()]);
  const items = [];
  for (const k of keys){
    const a = A.agg.get(k), b = B.agg.get(k);
    const rub = exclusions.has(k);
    const av = a ? a.amount : null, bv = b ? b.amount : null;
    const aR = av == null ? null : rub ? av : av * A.rate;
    const bR = bv == null ? null : rub ? bv : bv * B.rate;
    let status;
    if (av == null) status = 'new';
    else if (bv == null) status = 'gone';
    else status = Math.abs(bv - av) < 1e-6 ? 'same' : 'chg';
    const dCur = (rub || sameCur) ? (bv || 0) - (av || 0) : null;
    const dR = (bR || 0) - (aR || 0);
    items.push({ key: k, name: (b || a).name, rub, av, bv, aR, bR, dCur, dR,
      pct: aR ? dR / Math.abs(aR) : null, status, cntA: a ? a.count : 0, cntB: b ? b.count : 0 });
  }

  const T = { curA: 0, curB: 0, rubA: 0, rubB: 0, exA: 0, exB: 0 };
  for (const it of items){
    if (it.rub){ T.exA += it.av || 0; T.exB += it.bv || 0; }
    else { T.curA += it.av || 0; T.curB += it.bv || 0; }
    T.rubA += it.aR || 0; T.rubB += it.bR || 0;
  }
  T.convA = T.curA * A.rate; T.convB = T.curB * B.rate;
  T.dRub = T.rubB - T.rubA;
  if (sameCur){
    T.fVol = (T.curB - T.curA) * A.rate;
    T.fRate = T.curB * (B.rate - A.rate);
  } else {
    T.fVol = T.convB - T.convA; T.fRate = 0;
  }
  T.fRub = T.exB - T.exA;

  // возможные опечатки в названиях
  const onlyA = items.filter(i => i.status === 'gone'), onlyB = items.filter(i => i.status === 'new');
  const pairs = [];
  for (const g of onlyA) for (const k of B.agg.keys()) if (k !== g.key && k.length > 5 && levenshtein(g.key, k) <= 2) pairs.push([g.name, B.agg.get(k).name, 'A']);
  for (const n of onlyB) for (const k of A.agg.keys()) if (k !== n.key && k.length > 5 && levenshtein(n.key, k) <= 2) pairs.push([A.agg.get(k).name, n.name, 'B']);
  for (const [x, y, s] of pairs) warns.push(`Похоже на опечатку: «${x}» и «${y}» — сейчас это разные позиции (${s === 'A' ? 'первая есть только в ' + A.label : 'вторая есть только в ' + B.label}). Исправьте название во вставке, если это одно и то же.`);

  return { A, B, items, T, warns, sameCur };
}

/* ---------- rendering ---------- */
let sortCol = 'dR', sortDir = -1, filter = 'all', search = '';
let last = null;
const STATUS = { new: ['новая', 'b-new'], gone: ['пропала', 'b-gone'], chg: ['изменилась', 'b-chg'], same: ['без изменений', 'b-same'] };

function renderExcl(){
  const box = document.getElementById('exclList');
  const chips = [...exclusions].map(([k, n]) => `<span class="chip">${esc(n)} ₽<button title="Убрать" data-unexcl="${esc(k)}">×</button></span>`).join('');
  box.innerHTML = `<b>Позиции в рублях (не конвертируются):</b> ${chips || '<span class="muted">нет</span>'}`;
}
document.getElementById('exclList').addEventListener('click', e => {
  const k = e.target.getAttribute('data-unexcl');
  if (k != null){ exclusions.delete(k); saveExcl(); render(); }
});

function factorRow(name, sub, v, max, color, cls){
  const w = max > 0 ? Math.min(50, Math.abs(v) / max * 50) : 0;
  const left = v >= 0 ? 50 : 50 - w;
  return `<div class="fac ${cls || ''}"><div class="n">${name}${sub ? `<small>${sub}</small>` : ''}</div>
    <div class="bar"><div class="fill" style="left:${left}%;width:${w}%;background:${color}"></div><div class="axis"></div></div>
    <div class="val ${sign(v)}">${s2(v)} ₽</div></div>`;
}

function buildComment(R){
  const { A, B, T, items, sameCur } = R;
  const sa = CUR_SYM[A.cur], sb = CUR_SYM[B.cur];
  const pct = T.rubA ? T.dRub / T.rubA : null;
  const dir = T.dRub > 0.005 ? 'выросли' : T.dRub < -0.005 ? 'снизились' : 'не изменились';
  const L = [];
  let head = `Расходы на серверы за ${B.label} — ${f2(T.rubB)} ₽ против ${f2(T.rubA)} ₽ за ${A.label}`;
  head += Math.abs(T.dRub) >= 0.005 ? `: ${dir} на ${f2(Math.abs(T.dRub))} ₽ (${sPct(pct)}).` : ': не изменились.';
  L.push(head);
  if (A.cur !== 'RUB' || B.cur !== 'RUB'){
    if (sameCur) L.push(`Сумма в валюте: ${f2(T.curA)} ${sa} → ${f2(T.curB)} ${sb} (${s2(T.curB - T.curA)} ${sa}).`);
    else L.push(`Сумма в валюте: ${f2(T.curA)} ${sa} → ${f2(T.curB)} ${sb}.`);
  }
  L.push('Факторы изменения:');
  if (sameCur){
    L.push(`• курс ${A.cur} (${nf4.format(A.rate)} → ${nf4.format(B.rate)}): ${s2(T.fRate)} ₽;`);
    L.push(`• объём потребления (${s2(T.curB - T.curA)} ${sa} по курсу ${A.label}): ${s2(T.fVol)} ₽;`);
  } else {
    L.push(`• конвертируемые позиции: ${s2(T.fVol)} ₽;`);
  }
  const rubNames = items.filter(i => i.rub).map(i => i.name);
  L.push(`• рублёвые позиции${rubNames.length ? ' (' + rubNames.join(', ') + ')' : ''}: ${s2(T.fRub)} ₽.`);

  const moved = items.filter(i => i.status !== 'same').sort((x, y) => Math.abs(y.dR) - Math.abs(x.dR)).slice(0, 5);
  if (moved.length){
    L.push('Основные изменения по позициям:');
    for (const i of moved){
      const cur = i.rub ? '₽' : sa;
      let t;
      if (i.status === 'new') t = `новая, ${f2(i.bv)} ${cur}`;
      else if (i.status === 'gone') t = `пропала (было ${f2(i.av)} ${cur})`;
      else t = i.dCur != null ? `${f2(i.av)} → ${f2(i.bv)} ${cur} (${s2(i.dCur)} ${cur})` : `${s2(i.dR)} ₽`;
      L.push(`• ${i.name}: ${t}${i.rub ? '' : `, ${s2(i.dR)} ₽`};`);
    }
    L[L.length - 1] = L[L.length - 1].replace(/;$/, '.');
  }
  const nNew = items.filter(i => i.status === 'new').length, nGone = items.filter(i => i.status === 'gone').length;
  if (nNew || nGone) L.push(`Новых позиций: ${nNew}, пропавших: ${nGone}.`);
  return L.join('\n');
}

function render(){
  const R = compute(); last = R;
  const { A, B, items, T, warns, sameCur } = R;

  for (const s of sides){
    const p = R[s];
    el[s].rate.disabled = state[s].cur === 'RUB';
    let t = `Строк: ${p.rows.length}, уникальных позиций: ${p.agg.size}`;
    if (p.bad.length) t += ` · <span class="bad" title="${esc(p.bad.map(b => b.line + ': ' + b.text).join('\n'))}">не распознано: ${p.bad.length} (стр. ${p.bad.slice(0, 5).map(b => b.line).join(', ')}${p.bad.length > 5 ? '…' : ''})</span>`;
    el[s].info.innerHTML = t;
  }
  renderExcl();

  const res = document.getElementById('results');
  if (!items.length){ res.innerHTML = '<p class="muted section">Вставьте данные, чтобы увидеть сравнение.</p>'; return; }

  const sa = CUR_SYM[A.cur], sb = CUR_SYM[B.cur];
  const max = Math.max(Math.abs(T.fVol), Math.abs(T.fRate), Math.abs(T.fRub), Math.abs(T.dRub));
  const pct = T.rubA ? T.dRub / T.rubA : null;

  let html = `<div class="kpis">
    <div class="card kpi"><div class="k">Итог ${esc(A.label)}</div><div class="v">${f2(T.rubA)} ₽</div><div class="s">${f2(T.curA)} ${sa} + ${f2(T.exA)} ₽ в рублях</div></div>
    <div class="card kpi"><div class="k">Итог ${esc(B.label)}</div><div class="v">${f2(T.rubB)} ₽</div><div class="s">${f2(T.curB)} ${sb} + ${f2(T.exB)} ₽ в рублях</div></div>
    <div class="card kpi"><div class="k">Изменение, ₽</div><div class="v ${sign(T.dRub)}">${s2(T.dRub)} ₽</div><div class="s">${sPct(pct)}</div></div>
    <div class="card kpi"><div class="k">Изменение в валюте</div><div class="v ${sign(T.curB - T.curA)}">${sameCur ? s2(T.curB - T.curA) + ' ' + sa : '—'}</div><div class="s">${f2(T.curA)} → ${f2(T.curB)}</div></div>
  </div>
  <div class="card"><h2>Факторный анализ изменения, ₽</h2><div class="factors">`;
  if (sameCur){
    html += factorRow('Курс', `${esc(A.cur)}: ${nf4.format(A.rate || 0)} → ${nf4.format(B.rate || 0)}; сумма ${esc(B.label)} × Δкурс`, T.fRate, max, 'var(--f-rate)');
    html += factorRow('Объём', `Δ ${s2(T.curB - T.curA)} ${sa} × курс ${esc(A.label)}`, T.fVol, max, 'var(--f-vol)');
  } else {
    html += factorRow('Конвертируемые позиции', 'валюты различаются', T.fVol, max, 'var(--f-vol)');
  }
  html += factorRow('Рублёвые позиции', `${f2(T.exA)} → ${f2(T.exB)} ₽`, T.fRub, max, 'var(--f-rub)');
  html += factorRow('<b>Итого</b>', '', T.dRub, max, 'var(--muted)', 'total');
  html += `</div>${warns.length ? '<div class="warns">' + warns.map(w => `<div class="warn">${esc(w)}</div>`).join('') + '</div>' : ''}</div>`;

  html += `<div class="card section"><div class="row" style="justify-content:space-between;align-items:center"><h2 style="margin:0">Комментарий</h2><button id="btnCopy">Скопировать</button></div>
    <textarea id="comment" spellcheck="false">${esc(buildComment(R))}</textarea></div>`;

  const counts = { all: items.length, chg: 0, new: 0, gone: 0, same: 0 };
  items.forEach(i => counts[i.status]++);
  const fb = (k, t) => `<button data-filter="${k}" class="${filter === k ? 'on' : ''}">${t} (${counts[k]})</button>`;
  html += `<div class="section"><div class="filters">${fb('all', 'Все')}${fb('chg', 'Изменились')}${fb('new', 'Новые')}${fb('gone', 'Пропали')}${fb('same', 'Без изменений')}
    <input type="text" id="search" placeholder="Поиск по названию" value="${esc(search)}"></div>`;

  let rows = items.filter(i => (filter === 'all' || i.status === filter) && (!search || i.key.includes(search.toLowerCase())));
  const val = (i, c) => c === 'name' ? i.name.toLowerCase() : c === 'status' ? i.status : (i[c] == null ? -Infinity : i[c]);
  rows.sort((x, y) => {
    let a = val(x, sortCol), b = val(y, sortCol);
    if (sortCol === 'dR' || sortCol === 'dCur'){ a = Math.abs(a); b = Math.abs(b); }
    return (a < b ? -1 : a > b ? 1 : 0) * sortDir || x.name.localeCompare(y.name, 'ru');
  });

  const cols = [
    ['rub', '₽', 'l'], ['name', 'Позиция', 'l'], ['status', 'Статус', 'l'],
    ['av', `${esc(A.label)} (${A.cur})`], ['bv', `${esc(B.label)} (${B.cur})`], ['dCur', 'Δ'],
    ['aR', `${esc(A.label)}, ₽`], ['bR', `${esc(B.label)}, ₽`], ['dR', 'Δ ₽'], ['pct', 'Δ % (₽)']
  ];
  html += `<div class="tablewrap"><table><thead><tr>${cols.map(([k, t, c]) =>
    `<th class="${c || ''}" data-sort="${k}" ${k === 'rub' ? 'title="Позиция уже в рублях — не конвертировать"' : ''}>${t}${sortCol === k ? (sortDir > 0 ? ' ▲' : ' ▼') : ''}</th>`).join('')}</tr></thead><tbody>`;
  const cnt = n => n > 1 ? ` <span class="muted" title="Строк во вставке">×${n}</span>` : '';
  for (const i of rows){
    const tag = i.rub ? '<span class="rubtag">₽</span>' : '';
    html += `<tr>
      <td class="l"><input type="checkbox" data-excl="${esc(i.key)}" ${i.rub ? 'checked' : ''} title="Не конвертировать (уже в рублях)"></td>
      <td class="l name" title="${esc(i.name)}">${esc(i.name)}</td>
      <td class="l"><span class="badge ${STATUS[i.status][1]}">${STATUS[i.status][0]}</span></td>
      <td>${i.av == null ? '—' : f2(i.av) + tag}${cnt(i.cntA)}</td>
      <td>${i.bv == null ? '—' : f2(i.bv) + tag}${cnt(i.cntB)}</td>
      <td class="${sign(i.dCur || 0)}">${i.dCur == null ? '—' : s2(i.dCur) + tag}</td>
      <td>${f2(i.aR)}</td><td>${f2(i.bR)}</td>
      <td class="${sign(i.dR)}">${s2(i.dR)}</td>
      <td class="${sign(i.dR)}">${sPct(i.pct)}</td></tr>`;
  }
  html += `<tr class="tot"><td></td><td class="l">Итого</td><td></td><td></td><td></td><td></td>
      <td>${f2(T.rubA)}</td><td>${f2(T.rubB)}</td><td class="${sign(T.dRub)}">${s2(T.dRub)}</td><td class="${sign(T.dRub)}">${sPct(pct)}</td></tr>
    <tr class="sub"><td></td><td class="l">в т. ч. в валюте</td><td></td><td>${f2(T.curA)} ${sa}</td><td>${f2(T.curB)} ${sb}</td><td>${sameCur ? s2(T.curB - T.curA) + ' ' + sa : '—'}</td>
      <td>${f2(T.convA)}</td><td>${f2(T.convB)}</td><td>${s2(T.convB - T.convA)}</td><td>${sPct(T.convA ? (T.convB - T.convA) / T.convA : null)}</td></tr>
    <tr class="sub"><td></td><td class="l">в т. ч. в рублях</td><td></td><td>${f2(T.exA)} ₽</td><td>${f2(T.exB)} ₽</td><td>${s2(T.fRub)} ₽</td>
      <td>${f2(T.exA)}</td><td>${f2(T.exB)}</td><td>${s2(T.fRub)}</td><td>${sPct(T.exA ? T.fRub / T.exA : null)}</td></tr>`;
  html += `</tbody></table></div></div>`;

  const focusSearch = document.activeElement && document.activeElement.id === 'search';
  res.innerHTML = html;
  if (focusSearch){ const s = document.getElementById('search'); s.focus(); s.setSelectionRange(s.value.length, s.value.length); }
}

document.getElementById('results').addEventListener('click', e => {
  const t = e.target;
  const ex = t.getAttribute && t.getAttribute('data-excl');
  if (ex != null){
    if (t.checked){ const it = last.items.find(i => i.key === ex); exclusions.set(ex, it ? it.name : ex); }
    else exclusions.delete(ex);
    saveExcl(); render(); return;
  }
  const th = t.closest && t.closest('th[data-sort]');
  if (th){
    const c = th.getAttribute('data-sort');
    if (c === 'rub') return;
    if (sortCol === c) sortDir = -sortDir; else { sortCol = c; sortDir = (c === 'name' || c === 'status') ? 1 : -1; }
    render(); return;
  }
  const fl = t.getAttribute && t.getAttribute('data-filter');
  if (fl){ filter = fl; render(); return; }
  if (t.id === 'btnCopy'){
    const ta = document.getElementById('comment');
    const done = () => { t.textContent = 'Скопировано'; setTimeout(() => { t.textContent = 'Скопировать'; }, 1500); };
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(ta.value).then(done, () => { ta.select(); document.execCommand('copy'); done(); });
    else { ta.select(); document.execCommand('copy'); done(); }
  }
});
document.getElementById('results').addEventListener('input', e => {
  if (e.target.id === 'search'){ search = e.target.value.trim(); render(); }
});

/* ---------- toolbar ---------- */
document.getElementById('btnSwap').onclick = () => { [state.A, state.B] = [state.B, state.A]; fillCards(); schedule(); };
document.getElementById('btnClear').onclick = () => {
  for (const s of sides) state[s].text = '';
  fillCards(); schedule();
};

/* ---------- XLSX export (без библиотек: zip без сжатия) ---------- */
const CRC_T = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++){ let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(u8){ let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = CRC_T[(c ^ u8[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function zip(files){
  const enc = new TextEncoder(), parts = [], central = [];
  let offset = 0;
  const d = new Date();
  const dosTime = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
  const dosDate = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  for (const [name, content] of files){
    const nb = enc.encode(name), data = enc.encode(content), crc = crc32(data);
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(8, 0, true);
    h.setUint16(10, dosTime, true); h.setUint16(12, dosDate, true); h.setUint32(14, crc, true);
    h.setUint32(18, data.length, true); h.setUint32(22, data.length, true); h.setUint16(26, nb.length, true); h.setUint16(28, 0, true);
    parts.push(new Uint8Array(h.buffer), nb, data);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint16(10, 0, true);
    c.setUint16(12, dosTime, true); c.setUint16(14, dosDate, true); c.setUint32(16, crc, true);
    c.setUint32(20, data.length, true); c.setUint32(24, data.length, true); c.setUint16(28, nb.length, true);
    c.setUint32(42, offset, true);
    central.push(new Uint8Array(c.buffer), nb);
    offset += 30 + nb.length + data.length;
  }
  const cdSize = central.reduce((s, p) => s + p.length, 0);
  const e = new DataView(new ArrayBuffer(22));
  e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true);
  e.setUint32(12, cdSize, true); e.setUint32(16, offset, true);
  return new Blob([...parts, ...central, new Uint8Array(e.buffer)], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
}
const xesc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])).replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g, '');
function colName(i){ let s = ''; i++; while (i){ const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; }
// styles: 0 обычный, 1 жирный, 2 число, 3 процент, 4 жирное число, 5 жирный процент, 6 курс
function sheetXml(rows, widths){
  let x = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols>';
  widths.forEach((w, i) => { x += `<col min="${i + 1}" max="${i + 1}" width="${w}" customWidth="1"/>`; });
  x += '</cols><sheetData>';
  rows.forEach((r, ri) => {
    x += `<row r="${ri + 1}">`;
    r.forEach((cell, ci) => {
      if (cell == null || cell === '') return;
      const v = typeof cell === 'object' ? cell.v : cell, st = typeof cell === 'object' ? (cell.s || 0) : 0;
      if (v == null || v === '') return;
      const ref = colName(ci) + (ri + 1);
      if (typeof v === 'number' && isFinite(v)) x += `<c r="${ref}" s="${st || 2}"><v>${v}</v></c>`;
      else x += `<c r="${ref}" s="${st}" t="inlineStr"><is><t xml:space="preserve">${xesc(v)}</t></is></c>`;
    });
    x += '</row>';
  });
  return x + '</sheetData></worksheet>';
}
function exportXlsx(){
  const R = last; if (!R || !R.items.length){ alert('Нет данных для выгрузки.'); return; }
  const { A, B, T, items, sameCur } = R;
  const H = s => ({ v: s, s: 1 });
  const sorted = items.slice().sort((x, y) => Math.abs(y.dR) - Math.abs(x.dR));
  const r1 = [[H('Позиция'), H('Статус'), H('В рублях'), H(`${A.label} (${A.cur})`), H(`${B.label} (${B.cur})`), H('Δ'), H(`${A.label}, ₽`), H(`${B.label}, ₽`), H('Δ ₽'), H('Δ % (₽)')]];
  for (const i of sorted){
    r1.push([i.name, STATUS[i.status][0], i.rub ? 'да' : '', i.av, i.bv, i.dCur, i.aR, i.bR, i.dR, i.pct == null ? null : { v: i.pct, s: 3 }]);
  }
  const b = v => v == null ? null : { v, s: 4 };
  r1.push([]);
  r1.push([H('Итого'), '', '', null, null, null, b(T.rubA), b(T.rubB), b(T.dRub), T.rubA ? { v: T.dRub / T.rubA, s: 5 } : null]);
  r1.push(['в т. ч. в валюте', '', '', T.curA, T.curB, sameCur ? T.curB - T.curA : null, T.convA, T.convB, T.convB - T.convA, T.convA ? { v: (T.convB - T.convA) / T.convA, s: 3 } : null]);
  r1.push(['в т. ч. в рублях', '', '', T.exA, T.exB, T.fRub, T.exA, T.exB, T.fRub, T.exA ? { v: T.fRub / T.exA, s: 3 } : null]);

  const r2 = [[H('Показатель'), H('Значение')],
    [`Валюта ${A.label}`, A.cur], [`Курс ${A.label}`, { v: A.rate, s: 6 }],
    [`Валюта ${B.label}`, B.cur], [`Курс ${B.label}`, { v: B.rate, s: 6 }], [],
    [`Итог ${A.label}, ${A.cur}`, T.curA], [`Итог ${B.label}, ${B.cur}`, T.curB],
    [`Итог ${A.label}, ₽`, T.rubA], [`Итог ${B.label}, ₽`, T.rubB], [H('Изменение, ₽'), b(T.dRub)], [],
    [H('Факторы, ₽'), null],
    ...(sameCur ? [['Курс', T.fRate], ['Объём', T.fVol]] : [['Конвертируемые позиции', T.fVol]]),
    ['Рублёвые позиции', T.fRub], [H('Итого'), b(T.fRate + T.fVol + T.fRub)], [],
    [H('Комментарий'), null]];
  document.getElementById('comment').value.split('\n').forEach(l => r2.push([l]));

  const styles = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
    '<numFmts count="1"><numFmt numFmtId="164" formatCode="0.0000000000000"/></numFmts>' +
    '<fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts>' +
    '<fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills>' +
    '<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>' +
    '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="7">' +
    '<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>' +
    '<xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/>' +
    '<xf numFmtId="4" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/>' +
    '<xf numFmtId="10" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/>' +
    '<xf numFmtId="4" fontId="1" fillId="0" borderId="0" xfId="0" applyNumberFormat="1" applyFont="1"/>' +
    '<xf numFmtId="10" fontId="1" fillId="0" borderId="0" xfId="0" applyNumberFormat="1" applyFont="1"/>' +
    '<xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/>' +
    '</cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>';
  const files = [
    ['[Content_Types].xml', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/worksheets/sheet2.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>'],
    ['_rels/.rels', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'],
    ['xl/workbook.xml', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="Сравнение" sheetId="1" r:id="rId1"/><sheet name="Итоги" sheetId="2" r:id="rId2"/></sheets></workbook>'],
    ['xl/_rels/workbook.xml.rels', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet2.xml"/><Relationship Id="rId3" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>'],
    ['xl/styles.xml', styles],
    ['xl/worksheets/sheet1.xml', sheetXml(r1, [46, 16, 10, 16, 16, 12, 16, 16, 14, 11])],
    ['xl/worksheets/sheet2.xml', sheetXml(r2, [34, 22])]
  ];
  const blob = zip(files);
  const a = document.createElement('a');
  const fn = `серверы_${A.label}_vs_${B.label}.xlsx`.replace(/[\\/:*?"<>|]/g, '_');
  a.href = URL.createObjectURL(blob); a.download = fn;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
document.getElementById('btnXlsx').onclick = exportXlsx;

render();
})();
